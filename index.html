<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porsche 911 GT3 RS Parallax</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@700&display=swap');

        /* VARIABLES DE EDICIÓN RÁPIDA */
        :root {
            --car-size: 55%;       /* Edita el tamaño del coche (ej: 40%, 70%) */
            --car-position: 20vh;  /* Posición vertical (más alto = 0vh, más bajo = 30vh) */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #FCEFEF;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Lexend Deca', sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        /* RELOJ: Posicionado arriba */
        #clock {
            position: absolute;
            z-index: 1;
            color: #D6D6D6;
            font-size: 20vw;
            letter-spacing: -5px;
            user-select: none;
            text-align: center;
            top: 10%; 
            transition: transform 0.2s ease-out;
        }

        /* COCHE: Usa las variables definidas arriba */
        .car-container {
            position: absolute;
            z-index: 2;
            width: var(--car-size); 
            max-width: 1000px;
            margin-top: var(--car-position); 
            pointer-events: none;
            transition: transform 0.15s ease-out;
        }

        .car-container img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 25px 50px rgba(0,0,0,0.12));
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="clock">00:00</div>
        <div class="car-container" id="car">
            <img src="P911.png" alt="Porsche 911 GT3 RS">
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
        }

        setInterval(updateClock, 1000);
        updateClock();

        const car = document.getElementById('car');
        const clock = document.getElementById('clock');

        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 35;
            const y = (window.innerHeight / 2 - e.pageY) / 35;

            car.style.transform = `translateX(${-x * 1.5}px) translateY(${-y * 1.5}px) rotateX(${-y/2}deg) rotateY(${x/2}deg)`;
            clock.style.transform = `translateX(${x}px) translateY(${y}px)`;
        });
    </script>
</body>
</html>
